<div class="page-header">
  <h2>Catégories ({{ categories().length }})</h2>
  <a routerLink="/categories/new" class="btn btn-primary">Nouvelle catégorie</a>
</div>

@if (errorMessage(); as message) {
  <p class="alert" role="alert">{{ message }}</p>
}

<ul class="rows">
  @for (category of categories(); track category.id) {
    <li class="card row">
      <span class="dot" [style.background-color]="category.color"></span>
      <a class="name" [routerLink]="['/categories', category.id]">{{ category.name }}</a>
      <div class="actions">
        <a [routerLink]="['/categories', category.id, 'edit']" class="btn">Modifier</a>
        <button type="button" class="btn-danger" (click)="remove(category)">Supprimer</button>
      </div>
    </li>
  } @empty {
    <li class="card empty">Aucune catégorie pour l'instant.</li>
  }
</ul>
