<div class="page-header">
  <h2>Catégories</h2>
  <a routerLink="/categories/new">Nouvelle catégorie</a>
</div>

<ul class="list">
  @for (category of categories(); track category.id) {
    <li>
      <span class="dot" [style.background-color]="category.color"></span>
      <a [routerLink]="['/categories', category.id]">{{ category.name }}</a>
      <a [routerLink]="['/categories', category.id, 'edit']">Modifier</a>
    </li>
  } @empty {
    <li>Aucune catégorie pour l'instant.</li>
  }
</ul>
